# 每日增量爬蟲：台灣 09:23（01:23 UTC）排程。錯開整點——GitHub 高負載時
# 整點 schedule 事件可能延遲甚至丟棄（2026-08-28 首次排程即未觸發）。
# 跑在 self-hosted runner（使用者 WSL；官網有 Cloudflare，雲端 runner 進不去）。
# 機器未開機時 job 會排隊等 runner 上線（至多 24 小時），開機即補跑。
name: daily-crawl
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

# GITHUB_TOKEN 預設唯讀，push .db 需要 contents 寫入權限；
# push 後要自己 `gh workflow run pages.yml`（GITHUB_TOKEN 的 push 不觸發其他 workflow），需要 actions 寫入權限
permissions:
  contents: write
  actions: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, tvl]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 每日增量更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/daily_update.sh
