# 每日增量更新，跑在 GitHub 雲端 runner（cloud job，#292）。
# 主要由比分服務（score/，部署在 Cloudflare Workers，名稱 tvl-score，#294）以 workflow_dispatch 觸發：每天台灣 09:23 整包，
# 比賽日 15:30、18:30、21:15 帶 mode=slim 跑精簡版；不帶輸入時是整包、寫入。
# 備援期間（#296 退役前）手動觸發可選 runner=laptop 改在筆電的 self-hosted runner 跑（laptop job），用法見 docs/ops/daily-crawl.md。
# schedule 錯開整點——GitHub 高負載時整點 schedule 事件可能延遲甚至丟棄（2026-08-28 首次排程即未觸發），實際常晚 4–7 小時才觸發；
# 它在雲端 runner 上跑整包、寫入，比分服務漏掉的那天由它補上。
name: daily-crawl
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 整包（full）或只抓當天比分的精簡（slim）
        type: choice
        options: [full, slim]
        default: full
      runner:
        description: 筆電的自架 runner（laptop）或 GitHub 雲端 runner（cloud）
        type: choice
        options: [cloud, laptop]
        default: cloud
      dry_run:
        description: 不寫入（不 commit、不 push、不啟動網站建置）
        type: boolean
        default: false

# GITHUB_TOKEN 預設唯讀，push .db 需要 contents 寫入權限；
# push 後要自己 `gh workflow run pages.yml`（GITHUB_TOKEN 的 push 不觸發其他 workflow），需要 actions 寫入權限
permissions:
  contents: write
  actions: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  laptop:
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'laptop'
    runs-on: [self-hosted, tvl]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 每日增量更新
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/daily_update.sh

  cloud:
    if: github.event_name == 'schedule' || inputs.runner != 'laptop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # setup-python 放進 PATH 的 python；daily_update.sh 預設的 ~/venvs/tvl 只在筆電上有
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 每日增量更新
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/daily_update.sh
