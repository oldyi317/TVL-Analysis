<html lang="zh-Hant"><head><meta charset="utf-8"><title>2024-10-17 新聞：本週末成大點燃戰火 連莊男排迎回旅日好手高偉誠拚3連霸 | TVL 企業排球聯賽官方網站 - 企業22年甲級男女排球聯賽｜中華民國排球協會</title></head><body>
<p>高偉誠這次回歸將披上冠軍隊連莊戰袍，連莊隊長張昀亮說：「小高有旅日經驗，肯定學習到很多，他的加入對於球隊戰力肯定有幫助。」由於得分王、外援布萊恩受傷，這季確定報銷，張昀亮坦言，陣容變化確實不小，「近期訓練還是在找最好陣容去應對接下來企業聯賽。」</p>
<p>女子組方面，今年剩下4支球隊，但多了新球隊義力營造，以青女代表隊為班底組成，陣中7名成員張庭瑋、邱凡綺、陳薏、陳品宇、吳紫華、馬德蓉以及李莙妮代表台灣參加今年U17世界錦標賽拿下第4名，未來備受期待。</p>
